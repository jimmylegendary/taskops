name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install workspace dependencies
        run: npm ci

      - name: Install OpenClaw packaging toolchain
        run: npm install -g openclaw

      - name: Verify CLI + plugin workspaces
        run: npm run verify

      - name: Run skill regression tests
        run: python3 -m unittest discover -s skill/tests

      - name: Package skill smoke artifact
        run: |
          PACKAGER="$(npm root -g)/openclaw/skills/skill-creator/scripts/package_skill.py"
          mkdir -p dist/skill-smoke
          python3 "$PACKAGER" skill dist/skill-smoke
          ls -la dist/skill-smoke

  build-release-assets:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install workspace dependencies
        run: npm ci

      - name: Install OpenClaw packaging toolchain
        run: npm install -g openclaw

      - name: Derive release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using version: ${VERSION}"

      - name: Run release preflight
        run: npm run release:preflight
        env:
          TASKOPS_RELEASE_VERSION: ${{ steps.version.outputs.version }}

      - name: List release assets
        run: |
          ls -la dist/release/v${{ steps.version.outputs.version }}

      - name: Upload release assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskops-release-assets
          path: dist/release/v${{ steps.version.outputs.version }}/*

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/v${{ steps.version.outputs.version }}/*.tgz
            dist/release/v${{ steps.version.outputs.version }}/*.zip
            dist/release/v${{ steps.version.outputs.version }}/*.skill
          generate_release_notes: true

  publish-cli-to-npm:
    runs-on: ubuntu-latest
    needs: build-release-assets
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Derive release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using version: ${VERSION}"

      - name: Download release assets artifact
        uses: actions/download-artifact@v4
        with:
          name: taskops-release-assets
          path: dist/release/v${{ steps.version.outputs.version }}

      - name: Publish CLI package tarball
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is not configured; skipping npm publish."
            exit 0
          fi
          npm publish dist/release/v${{ steps.version.outputs.version }}/taskops-${{ steps.version.outputs.version }}.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-skill-to-clawhub:
    runs-on: ubuntu-latest
    needs: build-release-assets
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install ClawHub CLI
        run: npm install -g clawhub

      - name: Derive release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using version: ${VERSION}"

      - name: Log in to ClawHub
        run: |
          if [ -z "${CLAWHUB_TOKEN}" ]; then
            echo "CLAWHUB_TOKEN is not configured; skipping ClawHub publish."
            echo "skip_clawhub=true" >> "$GITHUB_ENV"
            exit 0
          fi
          clawhub login --token "$CLAWHUB_TOKEN" --no-browser
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

      - name: Validate ClawHub auth
        if: env.skip_clawhub != 'true'
        run: clawhub whoami

      - name: Publish TaskOps skill
        if: env.skip_clawhub != 'true'
        run: |
          clawhub publish skill \
            --slug taskops \
            --name "TaskOps" \
            --version "${{ steps.version.outputs.version }}" \
            --changelog "GitHub release v${{ steps.version.outputs.version }}" \
            --no-input
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
