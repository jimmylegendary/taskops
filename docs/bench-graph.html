<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskOps 벤치 실행 그래프 — 인스턴스별 run-graph tree</title>
<style>
  :root{
    --bg:#0e1217; --panel:#151b23; --panel2:#1a222c; --line:#26303c; --line2:#33404f;
    --ink:#e7edf4; --mut:#93a0b0; --dim:#5d6b7c;
    --fn:#2dd4bf; --tp:#4ade80; --fp:#f87171; --tn:#6aabfa; --fn2:#fbbf24; --und:#5d6b7c; --violet:#b096f8;
    --mono:ui-monospace,'JetBrains Mono','Cascadia Code',Consolas,monospace;
    --sans:'Pretendard Variable',Pretendard,-apple-system,'Noto Sans KR','Malgun Gothic',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}

  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(14,18,23,.98),rgba(14,18,23,.93));
    backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:13px 22px}
  header h1{font-size:17px;font-weight:800;letter-spacing:-.01em}
  header h1 .sub{color:var(--mut);font-weight:600;font-size:12.5px;margin-left:8px}
  .bstats{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
  .bstat{border:1px solid var(--line);border-radius:9px;padding:5px 11px;background:var(--panel);font-size:12px;color:var(--mut)}
  .bstat b{color:var(--ink);font-weight:700}
  .bstat .hi{font-family:var(--mono);font-weight:700}
  .bstat .win{color:var(--tp)} .bstat .lose{color:var(--fp)}

  .wrap{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 62px)}
  nav{border-right:1px solid var(--line);height:calc(100vh - 62px);overflow-y:auto;position:sticky;top:62px;background:var(--bg);padding:10px 8px 40px}
  nav .grp{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;padding:14px 10px 6px;display:flex;justify-content:space-between;align-items:baseline}
  nav .grp:first-child{padding-top:4px}
  nav .grp .gm{font-family:var(--mono);font-size:10.5px;color:var(--mut)}
  nav a.inst{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--mut);font-size:12.5px;border:1px solid transparent;cursor:pointer}
  nav a.inst:hover{background:var(--panel);color:var(--ink)}
  nav a.inst.on{background:var(--panel2);color:var(--ink);border-color:var(--line2)}
  nav a.inst .iid{font-family:var(--mono);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .dots{display:flex;gap:3px;flex-shrink:0}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .dot.TP{background:var(--tp)} .dot.FP{background:var(--fp)} .dot.TN{background:var(--tn)} .dot.FN{background:var(--fn2)} .dot.undetermined{background:var(--und)}

  main{padding:22px 26px 90px}
  .ihead{margin-bottom:6px}
  .ihead .bench{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fn);font-weight:700}
  .ihead h2{font-family:var(--mono);font-size:15px;font-weight:700;word-break:break-all;margin-top:3px;line-height:1.35}
  .ihead .jn{color:var(--dim);font-size:12px;margin-top:5px}
  .ihead .jn code{font-family:var(--mono);color:var(--mut)}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0 8px;font-size:12px;color:var(--mut)}
  .legend .lg{display:flex;align-items:center;gap:6px}
  .sw{width:10px;height:10px;border-radius:3px;display:inline-block}

  .armsrow{display:flex;gap:26px;align-items:flex-start;overflow-x:auto;padding:14px 4px 8px}
  .armcol{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 22px 22px;min-width:340px}
  .armhd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:2px}
  .armhd .an{font-weight:800;font-size:15px}
  .verdict{font-family:var(--mono);font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;border:1px solid}
  .verdict.TP{color:var(--tp);border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.08)}
  .verdict.FP{color:var(--fp);border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.1)}
  .verdict.TN{color:var(--tn);border-color:rgba(106,171,250,.4);background:rgba(106,171,250,.08)}
  .verdict.FN{color:var(--fn2);border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}
  .verdict.undetermined{color:var(--und);border-color:var(--line2)}
  .armsub{color:var(--dim);font-size:11.5px;margin-bottom:6px}

  /* ---- tree ---- */
  .tree{display:flex;flex-direction:column;align-items:center;padding-top:10px}
  .tnode{border:1px solid var(--line2);border-radius:9px;padding:7px 12px;background:var(--panel2);text-align:center;min-width:150px;max-width:240px;position:relative}
  .tnode .tk{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--nc,var(--mut))}
  .tnode .tl{font-weight:700;font-size:13.5px;margin-top:1px}
  .tnode .td{color:var(--mut);font-size:11.5px;margin-top:3px;line-height:1.35}
  .tnode.dim{opacity:.32}
  .tnode.hot{border-color:var(--nc,var(--line2));box-shadow:0 0 0 1px var(--nc,transparent) inset}
  .tnode .tags{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px}
  .tag{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:5px;color:var(--mut);border:1px solid var(--line2)}
  .tag.ok{color:var(--tp);border-color:rgba(74,222,128,.4)}
  .tag.bad{color:var(--fp);border-color:rgba(248,113,113,.4)}
  .tag.warn{color:var(--fn2);border-color:rgba(251,191,36,.4)}
  /* node accent by kind */
  .k-task{--nc:var(--dim)} .k-exec{--nc:var(--fn)} .k-verify{--nc:var(--violet)}
  .k-review{--nc:var(--violet)} .k-close{--nc:var(--tn)} .k-claim{--nc:var(--fn2)}
  .k-judge-pass{--nc:var(--tp)} .k-judge-fail{--nc:var(--fp)}
  .k-blocked{--nc:var(--fp)} .k-verified{--nc:var(--tp)}

  .vconn{width:2px;height:20px;background:var(--line2)}
  .vconn.hot{background:var(--nc,var(--tp))}
  .vlabel{font-size:10px;color:var(--dim);padding:2px 0}

  /* split: two branches under Verify */
  .split{display:flex;align-items:flex-start;gap:36px;position:relative;padding-top:18px}
  .split::before{content:'';position:absolute;top:0;left:25%;right:25%;height:2px;background:var(--line2)}
  .branch{display:flex;flex-direction:column;align-items:center;position:relative}
  .branch::before{content:'';position:absolute;top:-18px;width:2px;height:18px;background:var(--line2)}
  .branch.hot::before{background:var(--nc,var(--tp))}
  .blabel{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--mut);margin-bottom:8px}
  .branch.hot .blabel{color:var(--bc);border-color:var(--bc)}

  .takeaway{margin-top:18px;border:1px solid var(--line);border-radius:11px;padding:12px 16px;background:var(--panel);font-size:13px;color:var(--mut);max-width:860px}
  .takeaway b{color:var(--ink)}
  .empty{color:var(--dim);padding:60px 10px;text-align:center}
  @media (max-width:880px){.wrap{grid-template-columns:1fr}nav{display:none}main{padding:16px 12px 70px}}
</style>
</head>

  <nav id="nav"></nav>
  <main id="main"><div class="empty">왼쪽에서 인스턴스를 선택하세요.</div></main>
</div>

const VNAME = { TP:'TP · 진짜 완료', FP:'FP · 거짓완료', TN:'TN · 정직한 미완료', FN:'FN · 놓친 해결', undetermined:'판정 보류' };

function armStats(bench){
  const arms={};
  for (const inst of bench.instances) for (const a of inst.arms){
    const s=arms[a.arm]||(arms[a.arm]={TP:0,FP:0,TN:0,FN:0,undetermined:0}); s[a.cls]=(s[a.cls]||0)+1;
  }
  for (const k in arms){ const s=arms[k]; const dec=s.TP+s.FP+s.FN+s.TN;
    s.precision=s.TP+s.FP>0?s.TP/(s.TP+s.FP):null; s.recall=s.TP+s.FN>0?s.TP/(s.TP+s.FN):null;
    s.f1=(s.precision!=null&&s.recall!=null&&s.precision+s.recall>0)?2*s.precision*s.recall/(s.precision+s.recall):null;
    s.fpRate=dec>0?s.FP/dec:null; }
  return arms;
}
const pct=x=>x==null?'—':(100*x).toFixed(0)+'%';

const bs=document.getElementById('bstats');
for (const b of DATA){
  const st=armStats(b); const C=st['C (taskops)']; const A=st['A (bare)'];
  const key=b.metric==='F1'?'F1':'FP율';
  const cVal=b.metric==='F1'?pct(C&&C.f1):pct(C&&C.fpRate);
  const aVal=A?(b.metric==='F1'?pct(A.f1):pct(A.fpRate)):null;
  const cWin=b.metric==='F1'?'win':((C&&C.fpRate===0)?'win':'lose');
  const d=document.createElement('div'); d.className='bstat';
  d.innerHTML=`<b>${b.name}</b> · taskops ${key} <span class="hi ${cWin}">${cVal}</span>`+
    (aVal!=null?` <span style="color:var(--dim)">vs</span> bare <span class="hi lose">${aVal}</span>`:' <span style="color:var(--dim)">(bare 없음)</span>');
  bs.appendChild(d);
}

const nav=document.getElementById('nav'); let flat=[];
for (const b of DATA){
  const st=armStats(b); const C=st['C (taskops)'];
  const grp=document.createElement('div'); grp.className='grp';
  grp.innerHTML=`<span>${b.name}</span><span class="gm">${b.metric==='F1'?'F1 '+pct(C&&C.f1):'FP율 '+pct(C&&C.fpRate)}</span>`;
  nav.appendChild(grp);
  for (const inst of b.instances){
    const a=document.createElement('a'); a.className='inst';
    const dots=inst.arms.map(x=>`<span class="dot ${x.cls}" title="${x.arm}: ${x.cls}"></span>`).join('');
    const short=inst.id.replace(/^instance_/,'').replace(/-v[0-9a-f]+$/,'');
    a.innerHTML=`<span class="iid" title="${inst.id}">${short}</span><span class="dots">${dots}</span>`;
    const idx=flat.length; a.addEventListener('click',()=>select(idx)); nav.appendChild(a);
    flat.push({bench:b,inst,el:a});
  }
}

// ---- tree node builders ----
function tnode(kcls,kind,label,desc,tags,extra){
  return `<div class="tnode ${kcls} ${extra||''}"><div class="tk">${kind}</div><div class="tl">${label}</div>`+
    (desc?`<div class="td">${desc}</div>`:'')+
    (tags&&tags.length?`<div class="tags">${tags.join('')}</div>`:'')+`</div>`;
}
const tag=(t,c)=>`<span class="tag ${c||''}">${t}</span>`;
const conn=(hot,label)=>`${label?`<div class="vlabel">${label}</div>`:''}<div class="vconn ${hot?'hot':''}"></div>`;

function armTree(a, judge){
  const isBare=a.arm.startsWith('A');
  const done=a.taskops_status==='done';
  const judgePass=a.judge===true;
  let h='';
  // TASK
  h+=tnode('k-task','Task','solve','저장소를 편집해 공식 테스트 통과',[]);
  h+=conn(true,'executor');
  // EXECUTE
  const diff=a.diff_lines!=null?tag('diff '+a.diff_lines+(judge==='test_passed'?'':'줄'),''):'';
  const ed=a.agent_edited===true?tag('편집함','ok'):(a.agent_edited===false?tag('편집 없음','bad'):'');
  h+=tnode('k-exec','Execute','codex-cli','에이전트가 워크스페이스 편집',[diff,ed].filter(Boolean),'hot');
  if (isBare){
    // bare: no verify gate → self-report → judge (선형, 분기 없음이 요점)
    h+=conn(true,'게이트 없음');
    h+=tnode('k-claim','Self-report',a.claim?'"완료" 자칭':'미완료 보고','verify 없이 자기보고 그대로 종결',
      [a.claim?tag('claimed_done','warn'):tag('완료 주장 없음')],'hot');
    h+=conn(true,'숨은 정답');
    h+=tnode(judgePass?'k-judge-pass':'k-judge-fail','Judge · ground truth',
      judgePass?'테스트 통과':(judge==='test_passed'?'변조 test 실패':'테스트 불합격'),
      judge==='test_passed'?'spec-충돌 변조 test':'공식 Docker 하니스',[], 'hot');
    return h;
  }
  // wrapped: Execute → Verify → SPLIT(pass/fail)
  h+=conn(true,'requiredCheck');
  const vTags=[ a.judge===true?tag('grade PASS','ok'):a.judge===false?tag('grade FAIL','bad'):tag('grade 오류','warn') ];
  if (a.verifyRetries!=null) vTags.push(tag('retries≤'+a.verifyRetries,''));
  h+=tnode('k-verify','Verify · oracle','공식 grader','runner가 숨은 판정기를 직접 실행',vTags,'hot');
  // SPLIT: PASS branch (review→close verified) | FAIL branch (retry→blocked)
  const passHot = done;   // 실제로 approved+done이면 PASS 경로
  const failHot = !done;  // blocked이면 FAIL 경로
  h+='<div class="split">';
  // PASS branch
  h+=`<div class="branch ${passHot?'hot':''}" style="--nc:var(--tp);--bc:var(--tp)">`+
     `<span class="blabel">grade PASS</span>`+
     tnode('k-review','Review','approved','모든 requiredCheck 통과',[tag('approved','ok')], passHot?'hot':'dim')+
     conn(passHot,'')+
     tnode('k-verified','Close','verified_done','검증 근거로 완료 인증',[tag('verified_done','ok')], passHot?'hot':'dim')+
     `</div>`;
  // FAIL branch
  h+=`<div class="branch ${failHot?'hot':''}" style="--nc:var(--fp);--bc:var(--fp)">`+
     `<span class="blabel">grade FAIL</span>`+
     tnode('k-review','Review','rejected','requiredCheck 실패 → 완료 거부',[tag('rejected','bad')], failHot?'hot':'dim')+
     conn(failHot,'retry / saturation')+
     tnode('k-blocked','Close','blocked (정직)','완료를 자칭하지 않고 정직하게 멈춤',
       [tag('blocked','bad'), a.honest_stall?tag('honest_stall','ok'):'', a.false_completion===false?tag('false_completion 0','ok'):''].filter(Boolean), failHot?'hot':'dim')+
     `</div>`;
  h+='</div>';
  // merge → judge
  h+=conn(true,'숨은 정답 대조');
  h+=tnode(judgePass?'k-judge-pass':'k-judge-fail','Judge · ground truth',
    judgePass?'테스트 통과':(judge==='test_passed'?'변조 test 실패 (unsolvable)':'테스트 불합격'),
    judge==='test_passed'?'spec-충돌 변조 test':'공식 Docker 하니스',[],'hot');
  return h;
}

function takeaway(inst){
  const A=inst.arms.find(x=>x.arm.startsWith('A')); const C=inst.arms.find(x=>x.arm.startsWith('C'));
  if (A&&C){
    if (A.cls==='FP'&&C.cls==='TN') return `<b>같은 과제, 갈리는 지점은 Verify.</b> bare는 verify 게이트가 없어 self-report에서 "완료"로 직행(FP). taskops는 Verify에서 grade FAIL → <b style="color:var(--fp)">FAIL 브랜치</b> → <b style="color:var(--tn)">blocked(정직)</b>로 흘러 false_completion을 막았다.`;
    if (A.cls==='FP'&&C.cls==='TP') return `<b>bare는 거짓완료, taskops는 진짜 완료.</b> bare는 self-report로 완료 주장했으나 불합격(FP). taskops는 grade PASS → <b style="color:var(--tp)">PASS 브랜치</b> → verified_done(TP). 능력과 정직성 둘 다.`;
    if (A.cls==='TP'&&C.cls==='TP') return `<b>둘 다 진짜 해결(solvable-easy).</b> bare도 실제로 풀었고, taskops는 Verify로 그 완료를 <b>독립 확인</b>해 같은 PASS 브랜치로 갔다 — 이런 쉬운 과제에선 격차가 작다.`;
  }
  if (C&&C.cls==='TP') return `<b>taskops가 PASS 브랜치로 verified 완료.</b> codex가 실제 편집(diff ${C.diff_lines})하고 공식 grader가 숨은 테스트로 통과 확인. 음성 대조(no-fix→FAIL)로 grader 진위 검증됨.`;
  return '';
}

function select(idx){
  flat.forEach((f,i)=>f.el.classList.toggle('on',i===idx));
  const {inst,bench}=flat[idx];
  const arms=inst.arms.map(a=>
    `<div class="armcol"><div class="armhd"><span class="an">${a.arm}</span>`+
    `<span class="verdict ${a.cls}">${VNAME[a.cls]||a.cls}</span></div>`+
    `<div class="armsub">${a.wallclock_s!=null?a.wallclock_s+'s · ':''}${a.arm.startsWith('C')?'verify-grounded (verify가 완료를 가름)':'verify 게이트 없음 (자기보고 직행)'}</div>`+
    `<div class="tree">${armTree(a,bench.judge)}</div></div>`).join('');
  const tk=takeaway(inst);
  const short=inst.id.replace(/^instance_/,'');
  document.getElementById('main').innerHTML=
    `<div class="ihead"><div class="bench">${bench.name} · ${bench.metric==='F1'?'F1 (능력+정직성)':'FP율 (정직성)'}</div>`+
    `<h2>${short}</h2><div class="jn">ground truth: <code>${bench.judge}</code></div></div>`+
    `<div class="legend"><span class="lg"><span class="sw" style="background:var(--tp)"></span>TP</span>`+
    `<span class="lg"><span class="sw" style="background:var(--fp)"></span>FP 거짓완료</span>`+
    `<span class="lg"><span class="sw" style="background:var(--tn)"></span>TN 정직</span>`+
    `<span class="lg"><span class="sw" style="background:var(--violet)"></span>verify 분기점</span></div>`+
    `<div class="armsrow">${arms}</div>`+(tk?`<div class="takeaway">${tk}</div>`:'');
  window.scrollTo(0,0);
}
select(0);
