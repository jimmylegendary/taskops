<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TaskOps · live</title>
<style>
  :root{
    --ground:#0f1216; --panel:#161a20; --panel2:#1c222a; --line:#28303a; --ink:#e6eaf0; --muted:#8a94a3;
    --done:#22a699; --run:#e0a020; --block:#e05561; --deleg:#d98a2b; --explore:#6f7bd6; --idle:#5a6472;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px}
  .app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:48px 1fr;height:100vh}
  header{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  header .brand{font-family:var(--mono);font-weight:650;letter-spacing:.02em}
  header .work{font-family:var(--mono);font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
  header .spacer{flex:1}
  .live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--done);box-shadow:0 0 0 0 rgba(34,166,153,.6);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,166,153,.5)}70%{box-shadow:0 0 0 7px rgba(34,166,153,0)}100%{box-shadow:0 0 0 0 rgba(34,166,153,0)}}
  .pill{font-family:var(--mono);font-size:11px;padding:2px 9px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
  .pill.ok{color:var(--done);border-color:#1f4b46;background:#122420}

  /* queue */
  aside{border-right:1px solid var(--line);background:var(--panel);overflow:auto;display:flex;flex-direction:column}
  aside h2{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0;padding:14px 16px 8px;display:flex;align-items:center;gap:8px}
  aside h2 .count{margin-left:auto;background:var(--deleg);color:#151515;border-radius:20px;font-size:11px;padding:0 8px;font-weight:700}
  .qempty{padding:0 16px;color:var(--idle);font-size:12.5px}
  .qcard{margin:6px 12px;padding:11px 12px;border:1px solid var(--line);border-left:3px solid var(--deleg);border-radius:8px;background:var(--panel2);cursor:pointer}
  .qcard:hover{border-color:var(--deleg)}
  .qcard.sel{outline:1px solid var(--deleg)}
  .qcard .qt{font-weight:600;font-size:13px;margin-bottom:3px}
  .qcard .qq{color:var(--muted);font-size:12px;line-height:1.4;max-height:3.2em;overflow:hidden}
  .qcard .qbadge{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--deleg)}

  main{position:relative;overflow:auto}
  svg{display:block;width:100%;height:100%}
  .node rect{rx:8;stroke-width:1.5}
  .node text{font-family:var(--sans);font-size:12px;fill:var(--ink)}
  .node .sub{font-family:var(--mono);font-size:9px;fill:var(--muted)}
  .node{cursor:pointer}
  .node.sel rect{stroke:#fff;stroke-width:2}
  .edge{stroke:var(--line);stroke-width:1.5;fill:none}
  .edge.blocks{stroke-dasharray:4 3;stroke:#4a3030}
  .badge{font-family:var(--mono);font-size:9px}

  /* detail drawer */
  .detail{position:absolute;top:0;right:0;width:380px;height:100%;background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .18s ease;overflow:auto;box-shadow:-8px 0 24px rgba(0,0,0,.3)}
  .detail.open{transform:none}
  .detail .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .detail .dh .x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:18px}
  .detail .body{padding:16px}
  .detail h3{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
  .detail h3:first-child{margin-top:0}
  .kv{font-size:13px;color:#c7cede;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .rn{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line)}
  .rn .rtype{font-family:var(--mono);font-size:11px}
  .rn .st{margin-left:auto;font-family:var(--mono);font-size:10px;padding:1px 7px;border-radius:20px;border:1px solid var(--line)}
  textarea,input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:8px 10px;font-family:var(--sans);font-size:13px;margin-top:4px}
  textarea{min-height:56px;resize:vertical}
  .resolve{border:1px solid #4a3a20;border-radius:9px;background:#1a1610;padding:14px;margin-top:6px}
  .resolve .lab{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--deleg)}
  button.submit{margin-top:10px;background:var(--deleg);color:#151515;border:none;border-radius:7px;padding:9px 14px;font-weight:650;cursor:pointer;font-size:13px}
  button.submit:hover{filter:brightness(1.08)}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--done);color:#04140f;padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .legend{position:absolute;bottom:12px;left:12px;display:flex;gap:12px;font-size:11px;color:var(--muted);background:rgba(22,26,32,.85);border:1px solid var(--line);border-radius:8px;padding:7px 11px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="brand">TaskOps</span><span class="pill" id="closure">…</span>
    <span class="work" id="work"></span>
    <span class="spacer"></span>
    <span class="live"><span class="dot"></span><span id="livetxt">live</span></span>
  </header>
  <aside>
    <h2>Human queue <span class="count" id="qcount">0</span></h2>
    <div id="queue"></div>
  </aside>
  <main>
    <svg id="graph"></svg>
    <div class="legend">
      <span><i style="background:var(--done)"></i>done</span>
      <span><i style="background:var(--run)"></i>running</span>
      <span><i style="background:var(--deleg)"></i>awaiting human</span>
      <span><i style="background:var(--explore)"></i>explore/decompose</span>
      <span><i style="background:var(--block)"></i>blocked</span>
    </div>
    <div class="detail" id="detail"><div class="dh"><b id="dtitle"></b><span class="x" onclick="closeDetail()">×</span></div><div class="body" id="dbody"></div></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
let selId = null;
const COLOR = (t) => {
  if (t.awaitingHuman) return 'var(--deleg)';
  if (t.status === 'done') return 'var(--done)';
  if (t.status === 'blocked') return 'var(--block)';
  if (t.runReadiness === 'needs_exploration' || t.runReadiness === 'needs_decomposition' || t.runReadiness === 'needs_prototype') return 'var(--explore)';
  if (t.status === 'pending' && t.hasRun) return 'var(--run)';
  return 'var(--idle)';
};
async function j(u, opt) { const r = await fetch(u, opt); return r.json(); }

function layout(tasks, edges) {
  // depth via decompose edges from roots
  const byId = new Map(tasks.map(t => [t.id, t]));
  const childOf = new Map(); edges.filter(e => e.type === 'decompose').forEach(e => childOf.set(e.to, e.from));
  const depth = (id, seen = new Set()) => { let d = 0, c = id; while (childOf.has(c) && !seen.has(c)) { seen.add(c); c = childOf.get(c); d++; } return d; };
  const cols = {};
  tasks.forEach(t => { const d = depth(t.id); (cols[d] = cols[d] || []).push(t); });
  Object.values(cols).forEach(col => col.sort((a, b) => (a.order - b.order) || a.id.localeCompare(b.id)));
  const NW = 172, NH = 46, CW = 250, RH = 70, PADX = 40, PADY = 34;
  const pos = {};
  Object.keys(cols).forEach(d => cols[d].forEach((t, i) => { pos[t.id] = { x: PADX + d * CW, y: PADY + i * RH, w: NW, h: NH }; }));
  const maxRows = Math.max(1, ...Object.values(cols).map(c => c.length));
  return { pos, width: PADX * 2 + (Math.max(0, ...Object.keys(cols).map(Number)) ) * CW + NW, height: PADY * 2 + maxRows * RH };
}

async function renderGraph() {
  const g = await j('/api/graph');
  $('closure').textContent = g.closure && g.closure.complete ? 'all closed' : (g.errors ? g.errors + ' errors' : 'running');
  $('closure').className = 'pill' + (g.closure && g.closure.complete ? ' ok' : '');
  const { pos, width, height } = layout(g.tasks, g.edges);
  const svg = $('graph'); svg.setAttribute('viewBox', `0 0 ${Math.max(width, 600)} ${Math.max(height, 400)}`);
  let s = '';
  for (const e of g.edges) { const a = pos[e.from], b = pos[e.to]; if (!a || !b) continue; const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2, mx = (x1 + x2) / 2; s += `<path class="edge ${e.type}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`; }
  for (const t of g.tasks) { const p = pos[t.id]; const c = COLOR(t); const sel = t.id === selId ? ' sel' : ''; const badge = t.awaitingHuman ? '<text class="badge" x="' + (p.x + p.w - 16) + '" y="' + (p.y + 15) + '" fill="#151515">👤</text>' : ''; const title = (t.title || t.id).slice(0, 24); s += `<g class="node${sel}" onclick="openTask('${t.id}')"><rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" fill="${c}22" stroke="${c}"/><text x="${p.x + 12}" y="${p.y + 20}">${esc(title)}</text><text class="sub" x="${p.x + 12}" y="${p.y + 35}">${t.status}${t.resolverKind ? ' · ' + t.resolverKind : ''}</text>${badge}</g>`; }
  svg.innerHTML = s;
}
async function renderQueue() {
  const q = await j('/api/queue');
  $('qcount').textContent = q.length;
  $('queue').innerHTML = q.length ? q.map(x => `<div class="qcard${x.id === selId ? ' sel' : ''}" onclick="openTask('${x.id}')"><div class="qbadge">${x.status === 'invalid' ? 'needs full answer' : 'awaiting answer'}</div><div class="qt">${esc(x.title)}</div><div class="qq">${esc(x.question || '(no question)')}</div></div>`).join('') : '<div class="qempty">No pending human delegations.</div>';
}
async function openTask(id) {
  selId = id; renderGraph(); renderQueue();
  const t = await j('/api/task/' + encodeURIComponent(id));
  if (!t) return;
  $('dtitle').textContent = t.title;
  let html = `<h3>Task</h3><div class="kv">${esc(t.objective || '(no objective)')}</div>`;
  html += `<h3>State</h3><div class="kv">status: ${t.status}\nreadiness: ${t.runReadiness || '—'}\nacceptance: ${t.acceptanceMode}\nresolver: ${t.resolverKind || '—'}${t.delegation && t.delegation !== 'none' ? '\ndelegation: ' + t.delegation : ''}</div>`;
  if (t.runNodes && t.runNodes.length) { html += `<h3>Run graph</h3>` + t.runNodes.map(n => `<div class="rn"><span class="rtype">${n.type}</span><span style="color:var(--muted)">${n.role || ''}</span><span class="st">${n.status}${n.decision ? ' · ' + n.decision : ''}</span></div>`).join(''); }
  if (t.resolverKind === 'human' && (t.delegation === 'waiting' || t.delegation === 'invalid')) {
    html += `<h3>Answer the delegation</h3><div class="kv" style="color:var(--muted)">${esc(t.question || '')}</div>
      <div class="resolve"><div class="lab">DECISION (a concrete value)</div><input id="rdec" placeholder="e.g. Option A" />
      <div class="lab" style="margin-top:8px">BASIS (why)</div><textarea id="rbas" placeholder="one line"></textarea>
      <button class="submit" onclick="submitResolve('${t.id}')">Submit &amp; resume</button></div>`;
  } else if (t.decision) { html += `<h3>Decision</h3><div class="kv">${esc(t.decision)}</div>`; }
  $('dbody').innerHTML = html; $('detail').classList.add('open');
}
async function submitResolve(id) {
  const decision = $('rdec').value, basis = $('rbas').value;
  const r = await j('/api/resolve/' + encodeURIComponent(id), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ decision, basis }) });
  if (r.ok) { toast('Resolved — task will resume'); closeDetail(); refresh(); } else { toast('⚠ ' + (r.error || 'failed')); }
}
function closeDetail() { $('detail').classList.remove('open'); selId = null; renderGraph(); renderQueue(); }
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
async function refresh() { await renderGraph(); await renderQueue(); if (selId) openTask(selId); }
refresh().then(() => { const t = new URLSearchParams(location.search).get('task'); if (t) openTask(t); });
try { const es = new EventSource('/api/events'); es.addEventListener('update', () => refresh()); es.onerror = () => { $('livetxt').textContent = 'reconnecting'; }; es.onopen = () => { $('livetxt').textContent = 'live'; }; } catch (e) {}
</script>
</body>
</html>
